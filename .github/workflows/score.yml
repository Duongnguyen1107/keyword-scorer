name: Keyword ML Scorer

on:
  push:
    paths:
      - 'data/training_data.csv'   # retrain khi update data
      - 'data/keywords_to_score.csv'  # score khi có file mới
  workflow_dispatch:               # cho phép chạy thủ công trên UI

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: |
          python keyword_ml_scorer.py train \
            --data data/training_data.csv \
            --model model.pkl

      - name: Score keywords
        run: |
          python keyword_ml_scorer.py score \
            --input data/keywords_to_score.csv \
            --model model.pkl \
            --output output/scored_keywords.csv

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scored-keywords-${{ github.run_number }}
          path: output/
          retention-days: 30
